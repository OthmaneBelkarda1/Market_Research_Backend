[project]
name = "agent-etude-de-marche"
version = "0.1.0"
description = "Backend de l'Agent IA d'Etude de Marche E-commerce (Marketing Confort)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # --- product_extraction (domaine `extractions`) ---------------------------
    # `agent.py` importe `from langchain.agents import create_agent`, qui n'existe
    # qu'a partir de LangChain 1.0 (`langgraph.prebuilt.create_react_agent` est
    # deprecie en v1) : le `langchain>=0.3` du requirements.txt d'origine est donc
    # trop permissif et casserait a l'import.
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "python-dotenv>=1.0",
    "playwright>=1.45",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # --- market_study (domaine `studies`) -------------------------------------
    # Dependances du pipeline d'etude de marche, relevees de ses imports reels
    # (pas de son requirements.txt, plus permissif). Les autres paquets dont il a
    # besoin -- langchain-core, pydantic, httpx, python-dotenv -- sont deja au
    # socle, dans les memes versions que le venv ou le pipeline a ete valide :
    # l'ajout est purement additif, aucun conflit de version.
    "langchain-anthropic>=1.5,<2",
    "apify-client>=3.1,<4",
    "numpy>=2.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Agents fournis tels quels (voir README) : ni lintes ni formates par les regles du
# socle, et aucune de leurs lignes ne doit etre reecrite. Ils gardent leurs propres
# conventions -- le pipeline d'etude de marche est meme documente en francais.
extend-exclude = ["src/agents/product_extraction", "src/agents/market_study"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "ASYNC", # flake8-async
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
    "RUF",   # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "I001"]
# Faux pipeline : ces scripts SONT des executables dont le contrat est d'ecrire sur
# stdout, et dont l'import du module partage suit une manipulation de sys.path.
"tests/studies/fake_pipeline/*" = ["T20", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: sort sur le reseau (extraction reelle). Exclu par defaut : -m 'not integration'.",
]
